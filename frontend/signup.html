<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - ShareBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  </head>
  <body class="form-page-bg">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <i class="bi bi-box2-heart-fill text-primary me-2"></i>ShareBite
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item me-2"><a href="about.html" class="btn btn-outline-light btn-sm rounded-pill px-3">About</a></li>
            <li class="nav-item me-2"><a href="index.html#impact" class="btn btn-outline-light btn-sm rounded-pill px-3">Impact</a></li>
            <li class="nav-item me-2"><a href="login.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Login</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Sign Up Container -->
    <main class="container py-5 d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="w-100 mb-3" style="max-width: 450px;">
        <a href="index.html" class="btn btn-light btn-sm fw-bold shadow-sm"><i class="bi bi-arrow-left me-2"></i>Back to Home</a>
      </div>
      <div class="card shadow-lg border-0" style="max-width: 450px; width: 100%;">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Join ShareBite</h2>
            <p class="text-muted">Create an account to start sharing or receiving food</p>
          </div>
          <form id="signupForm">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" placeholder="John" required>
              </div>
              <div class="col-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
              </div>
            </div>
            
            <div class="mb-3">
              <label for="role" class="form-label">I am a</label>
              <select class="form-select" id="role">
                <option value="donor">Individual Donor</option>
                <option value="business">Restaurant / Business</option>
                <option value="ngo">Receive Food (NGO / Individual)</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Create a password" required>
            </div>
            
            <div class="mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label text-muted" for="terms">
                  <small>I agree to the <a href="#">Terms & Conditions</a></small>
                </label>
              </div>
            </div>
            
            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Create Account</button>
            <div class="mt-4 text-center">
              <p class="text-muted"><small>Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login</a></small></p>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        const email     = document.getElementById('email').value.trim();
        const password  = document.getElementById('password').value;
        const role      = document.getElementById('role').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');

        // Remove any existing error
        const oldAlert = document.getElementById('errorAlert');
        if (oldAlert) oldAlert.remove();

        // Basic validation
        if (password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        // Loading state
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account…';

        try {
          const isLocalFile = window.location.protocol === 'file:';
          const HOST = window.location.hostname || 'localhost';
          const BASE_URL = isLocalFile ? 'http://localhost:5003' : '';
          const res = await fetch(BASE_URL + '/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ firstName, lastName, email, password, role }),
          });

          const data = await res.json();

          if (!res.ok) {
            showError(data.error || 'Registration failed. Please try again.');
            return;
          }

          // Save token and user info — same structure as login
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('currentUser', JSON.stringify(data.user));

          // Redirect based on role
          const redirectUrl = role === 'ngo' ? 'available.html' : 'profile.html';
          window.location.href = redirectUrl;

        } catch (err) {
          console.error('Signup error:', err);
          showError('Network error. Make sure the server is running.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });

      function showError(msg) {
        const alert = document.createElement('div');
        alert.id = 'errorAlert';
        alert.className = 'alert alert-danger mt-3';
        alert.textContent = msg;
        document.getElementById('signupForm').appendChild(alert);
      }
    </script>
  </body>
</html>

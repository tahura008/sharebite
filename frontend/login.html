<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ShareBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  </head>
  <body class="form-page-bg">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <i class="bi bi-box2-heart-fill text-primary me-2"></i>ShareBite
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item me-2"><a href="about.html" class="btn btn-outline-light btn-sm rounded-pill px-3">About</a></li>
            <li class="nav-item me-2"><a href="index.html#impact" class="btn btn-outline-light btn-sm rounded-pill px-3">Impact</a></li>
            <li class="nav-item me-2" id="loginNav"><a href="login.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Login</a></li>
            <li id="signupNav"><a href="signup.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Sign Up</a></li>
            <li class="nav-item me-2 d-none" id="profileNav"><a href="profile.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Profile</a></li>
            <li class="nav-item me-2 d-none" id="logoutNav"><a href="#" id="logoutBtn" class="btn btn-outline-light btn-sm rounded-pill px-3">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Login Container -->
    <main class="container py-5 d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="w-100 mb-3" style="max-width: 400px;">
        <a href="index.html" class="btn btn-light btn-sm fw-bold shadow-sm"><i class="bi bi-arrow-left me-2"></i>Back to Home</a>
      </div>
      <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Welcome Back</h2>
            <p class="text-muted">Login to continue to ShareBite</p>
          </div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <div class="d-flex justify-content-between mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted" for="rememberMe"><small>Remember me</small></label>
              </div>
              <a href="#" class="text-primary text-decoration-none"><small>Forgot password?</small></a>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Login</button>
            <div class="mt-4 text-center">
              <p class="text-muted"><small>Don't have an account? <a href="signup.html" class="text-primary fw-bold text-decoration-none">Sign up</a></small></p>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email     = document.getElementById('email').value.trim();
        const password  = document.getElementById('password').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');

        // Show loading state
        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in…';

        // Remove any old error alert
        const oldAlert = document.getElementById('errorAlert');
        if (oldAlert) oldAlert.remove();

        try {
          const isLocalFile = window.location.protocol === 'file:';
          const HOST = window.location.hostname || 'localhost';
          const BASE_URL = isLocalFile || HOST === 'localhost' || HOST === '127.0.0.1' ? 'http://localhost:5000' : 'https://sharebite-1.onrender.com';
          const res = await fetch(BASE_URL + '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (!res.ok) {
            // Show error below the form
            const alert = document.createElement('div');
            alert.id = 'errorAlert';
            alert.className = 'alert alert-danger mt-3';
            alert.textContent = data.error || 'Login failed. Please try again.';
            e.target.appendChild(alert);
            document.getElementById('password').value = '';
            return;
          }

          // Save token and user info
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          window.location.href = 'profile.html';

        } catch (err) {
          console.error('Login error:', err);
          const alert = document.createElement('div');
          alert.id = 'errorAlert';
          alert.className = 'alert alert-danger mt-3';
          alert.textContent = 'Network error. Make sure the server is running.';
          e.target.appendChild(alert);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      });
    </script>
  </body>
</html>
